AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CropGuard on AWS: one EC2 instance running the Docker Compose stack, a private S3 bucket
  for crop photos, generated secrets in Secrets Manager, and a CloudFront distribution that
  provides HTTPS. Shell access is through Systems Manager Session Manager (no SSH port).

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, t3a.medium, t3a.large]
    Description: t3.medium (4 GB) is comfortable for MongoDB + API + ML model. t3.small works with the swap file the bootstrap adds.
  RepoUrl:
    Type: String
    Default: https://github.com/bharathvaj125/Cropguard.git
    Description: Public Git repository the instance clones and builds.
  Branch:
    Type: String
    Default: main
  AdminEmail:
    Type: String
    Default: admin@cropguard.local
    Description: Email of the first admin account. Its password is generated and stored in Secrets Manager.
  DataGovApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional data.gov.in key for live mandi prices. Leave empty to use the sample series.
  EnableCloudFront:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Put CloudFront in front of the server for HTTPS on a *.cloudfront.net address.
  VolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 200
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, 'true']
  IsUsEast1: !Equals [!Ref 'AWS::Region', us-east-1]

Resources:
  # ---------------------------------------------------------------------------
  # Storage for uploaded photos: private, encrypted, never public.
  # ---------------------------------------------------------------------------
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub cropguard-uploads-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt UploadsBucket.Arn
              - !Sub ${UploadsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Secrets generated by AWS, so no password ever appears in this template,
  # in user data or in the repository.
  # ---------------------------------------------------------------------------
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/app
      Description: Password of the first CropGuard admin account
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"adminEmail":"${AdminEmail}"}'
        GenerateStringKey: adminPassword
        PasswordLength: 20
        ExcludePunctuation: true
        RequireEachIncludedType: true

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/jwt
      Description: CropGuard JWT signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------------------------------------------------------------------------
  # Instance permissions: only what the app needs.
  # ---------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cropguard-app
          PolicyDocument:
            Statement:
              - Sid: UploadsReadWrite
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub ${UploadsBucket.Arn}/uploads/*
              - Sid: ReadSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AppSecrets, !Ref JwtSecret]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------------------------------------------------------------------
  # Network: HTTP in, everything out. No SSH: use Session Manager instead.
  # ---------------------------------------------------------------------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CropGuard web traffic
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from CloudFront and browsers
      # Outbound: the default rule (all traffic) is kept; the server pulls code,
      # packages, weather and S3.

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # Containers reach the instance role through IMDSv2; a hop limit of 2 lets the
        # request pass through the Docker bridge.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled

  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-server
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # First-boot setup. Output goes to /var/log/cropguard-bootstrap.log.
            exec > >(tee /var/log/cropguard-bootstrap.log) 2>&1
            set -euxo pipefail
            # Any failure tells CloudFormation straight away instead of timing out.
            trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}' ERR
            # cloud-init runs this without HOME; the Docker CLI and buildx need it for their config.
            export HOME=/root

            dnf install -y docker git jq aws-cfn-bootstrap
            systemctl enable --now docker

            # Docker Compose v2 and buildx plugins (not packaged for Amazon Linux).
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            curl -fsSL https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64 \
              -o /usr/local/lib/docker/cli-plugins/docker-buildx
            chmod +x /usr/local/lib/docker/cli-plugins/*

            # 2 GB swap so builds and the ML model fit on smaller instances.
            if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            git clone --depth 1 --branch ${Branch} ${RepoUrl} /opt/cropguard
            cd /opt/cropguard

            ADMIN_PASSWORD=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
              --secret-id ${AppSecrets} --query SecretString --output text | jq -r .adminPassword)
            JWT_SECRET=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
              --secret-id ${JwtSecret} --query SecretString --output text)

            umask 077
            cat > .env <<EOF
            JWT_SECRET=$JWT_SECRET
            HTTP_PORT=80
            TRUST_PROXY=${TrustProxy}
            STORAGE_DRIVER=s3
            S3_BUCKET=${UploadsBucket}
            AWS_REGION=${AWS::Region}
            SEED_ADMIN_EMAIL=${AdminEmail}
            SEED_ADMIN_PASSWORD=$ADMIN_PASSWORD
            DATA_GOV_API_KEY=${DataGovApiKey}
            EOF

            docker compose up -d --build

            # Wait until the API answers through nginx before reporting success.
            for i in $(seq 1 60); do
              if curl -fs http://127.0.0.1/api/health >/dev/null; then break; fi
              sleep 10
            done
            curl -fs http://127.0.0.1/api/health
            /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}
          - TrustProxy: !If [UseCloudFront, '2', '1']

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

  # ---------------------------------------------------------------------------
  # CloudFront: HTTPS for free on a *.cloudfront.net name, static files cached at
  # the edge, API requests passed straight through.
  # ---------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CropGuard
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: server
            # CloudFront needs a DNS name, so build the EC2 public name from the Elastic IP.
            DomainName: !If
              - IsUsEast1
              - !Sub
                - ec2-${Dashed}.compute-1.amazonaws.com
                - Dashed: !Join ['-', !Split ['.', !Ref ElasticIp]]
              - !Sub
                - ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com
                - Dashed: !Join ['-', !Split ['.', !Ref ElasticIp]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled (index.html must stay fresh)
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: /api/*
            TargetOriginId: server
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer (keeps Authorization)
          - PathPattern: /uploads/*
            TargetOriginId: server
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

Outputs:
  AppUrl:
    Description: Open this in a browser.
    Value: !If [UseCloudFront, !Sub 'https://${Distribution.DomainName}', !Sub 'http://${ElasticIp}']
  ServerIp:
    Value: !Ref ElasticIp
  InstanceId:
    Description: Connect with  aws ssm start-session --target <InstanceId>
    Value: !Ref Instance
  UploadsBucketName:
    Value: !Ref UploadsBucket
  AdminEmail:
    Value: !Ref AdminEmail
  AdminPasswordCommand:
    Description: Run this to read the generated admin password.
    Value: !Sub aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${AppSecrets} --query SecretString --output text
