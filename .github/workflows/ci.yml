name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint infra/aws/cropguard.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [backend, ml-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          cp .env.example .env
          echo "JWT_SECRET=ci-only-secret" >> .env
          docker compose build
      - name: Start the stack and check it answers
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost/api/health && break; sleep 5; done
          curl -fs http://localhost/api/health
          curl -fs http://localhost/ | grep -q '<div id="root">'
      - if: always()
        run: docker compose logs --tail 80
