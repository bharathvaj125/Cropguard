# Whole CropGuard stack on one machine (a laptop or a single cloud server).
#
#   cp .env.example .env      # then fill in JWT_SECRET and the seed passwords
#   docker compose up -d --build
#
# Open http://localhost (or the server's address). Only port 80 is published;
# MongoDB, the API and the ML service are reachable only inside this network.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml:
    build: ./ml-service
    restart: unless-stopped
    environment:
      ORT_THREADS: ${ORT_THREADS:-2}

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/cropguard}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      ML_SERVICE_URL: http://ml:8000
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cropguard.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_FARMER_EMAIL: ${SEED_FARMER_EMAIL:-farmer@cropguard.local}
      SEED_FARMER_PASSWORD: ${SEED_FARMER_PASSWORD:-}
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
      # Claude advisory (Track B). Bedrock uses the instance role; the Claude API needs a key.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      # AWS speech (Track B)
      POLLY_ENABLED: ${POLLY_ENABLED:-false}
      TRANSCRIBE_ENABLED: ${TRANSCRIBE_ENABLED:-false}
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mongo-data:
  uploads:
